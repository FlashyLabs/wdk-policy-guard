name: CodeQL

# Static analysis (GitHub's semantic code scanning) on every push/PR to main
# and on a weekly cron, so a vulnerability class introduced between pushes
# still gets caught. "Advanced setup" (a workflow file, not the dashboard
# toggle) so the configuration is reviewable in the same PR as any code
# change, like everything else here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # every Monday

# One analysis per ref at a time. Several pull_request runs starting in the
# same minute restored an overlay-base database written by a different
# codeql-action version and failed with
#   Loaded a configuration file for version '4.38.1', but running version '3.38.1'
# — a cache collision, not a finding. Every push run to main passed throughout.
# A contributor should never open a PR and be shown a red security scan that
# has nothing to do with their change.
concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3.38.1
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3.38.1
        with:
          category: '/language:javascript-typescript'
