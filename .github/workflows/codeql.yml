name: CodeQL

# Static analysis (GitHub's semantic code scanning) on every push/PR to main
# and on a weekly cron, so a vulnerability class introduced between pushes
# still gets caught. "Advanced setup" (a workflow file, not the dashboard
# toggle) so the configuration is reviewable in the same PR as any code
# change, like everything else here.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1' # every Monday

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@3ea06614dafe36dec890db3446326e0d40ce53d4 # v3.38.1
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          category: '/language:javascript-typescript'
